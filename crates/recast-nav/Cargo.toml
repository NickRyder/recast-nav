[package]
name = "recast-nav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Rust port of Recast navigation mesh generation and Detour pathfinding"
readme = "../../README.md"
keywords = ["navigation", "navmesh", "recast", "pathfinding"]
categories = ["algorithms", "game-development"]
publish = false

[dependencies]
glam.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
libm = { version = "0.2", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[features]
polyref64 = []
fma = []
serialize = ["dep:serde", "glam/serde"]
tracing = ["dep:tracing"]
libm = ["dep:libm", "glam/libm"]
cpp-oracle = ["dep:cc"]
native-bench = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "conformance"
required-features = ["cpp-oracle"]

[lints]
workspace = true

[[test]]
name = "runtime_conformance"
required-features = ["cpp-oracle"]

[[example]]
name = "library_bench"
required-features = ["native-bench"]
